spring.application.name=minishop
server.port=8080

# ===== การเชื่อมต่อ PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/minishop_db
spring.datasource.username=minishop
spring.datasource.password=minishop123

# ===== รัน schema.sql และ data.sql ทุกครั้งที่ start =====
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8


# ===== JWT =====
app.jwt.secret=${JWT_SECRET}
# อายุ token (มิลลิวินาที): 3600000 = 1 ชั่วโมง
app.jwt.expiration-ms=3600000